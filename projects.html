<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- EDIT ME: the text that shows in the browser tab -->
  <title>Student Work | Your Makerspace Name</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #000;
      --blue: #3554d9;
      --paper: #f5f6f1;
      --orange: #df6e56;
      --yellow: #f1fb8f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
      background: var(--paper);
      color: #111;
      line-height: 1.5;
    }
    a { color: inherit; }
    :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

    /* Top bar */
    .nav {
      display: flex; justify-content: space-between; gap: 1rem;
      padding: 1.25rem clamp(1rem, 4vw, 3rem);
      font-weight: 500;
    }
    .nav a { text-decoration: none; }
    .nav a:hover { text-decoration: underline; text-underline-offset: 4px; }

    /* Hero */
    .hero { padding: clamp(3rem, 10vw, 8rem) clamp(1rem, 4vw, 3rem) clamp(2.5rem, 6vw, 5rem); }
    h1 {
      margin: 0;
      font-size: clamp(3rem, 12.5vw, 9.5rem);
      line-height: 0.95;
      letter-spacing: -0.045em;
      font-weight: 600;
    }
    h1 em {
      font-family: "Instrument Serif", Georgia, serif;
      font-style: italic;
      font-weight: 400;
      letter-spacing: 0;
      color: var(--orange);
      font-size: 1.05em;
    }
    .hero p { max-width: 46ch; margin: 2rem 0 0; font-size: clamp(1.05rem, 2vw, 1.3rem); }

    /* Statement band */
    .band { display: grid; grid-template-columns: 1fr; }
    .band-art { background: var(--blue); display: grid; place-items: center; padding: 2.5rem; min-height: 300px; }
    .band-art svg { width: min(300px, 100%); height: auto; }
    .band-text { background: #fff; display: grid; place-items: center; padding: clamp(2.5rem, 7vw, 5rem); text-align: center; }
    .band-text p {
      margin: 0; max-width: 17em;
      font-size: clamp(1.2rem, 2.4vw, 1.9rem);
      line-height: 1.3; font-weight: 600; text-transform: uppercase;
    }
    @media (min-width: 700px) { .band { grid-template-columns: 1fr 1fr; } }

    /* Gallery */
    .gallery { background: var(--black); color: #fff; padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 4vw, 3rem); }
    .gallery :focus-visible { outline-color: var(--yellow); }
    h2 {
      margin: 0 0 1.5rem;
      font-size: clamp(2.6rem, 9vw, 7rem);
      line-height: 1; letter-spacing: -0.04em; font-weight: 500;
    }
    .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0 0 2.5rem; }
    .filters button {
      font: inherit; color: #fff; background: transparent;
      border: 1.5px solid #fff; border-radius: 999px;
      padding: 0.4rem 1rem; cursor: pointer;
    }
    .filters button[aria-pressed="true"] { background: var(--yellow); color: #000; border-color: var(--yellow); }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
    @media (min-width: 700px) {
      .grid { grid-template-columns: repeat(6, 1fr); gap: 1.25rem; }
      .tile.wide { grid-column: span 3; aspect-ratio: 4 / 3; }
      .tile.narrow { grid-column: span 2; aspect-ratio: 4 / 5; }
    }

    /* Project tiles: a showcase, not a link */
    .tile {
      position: relative; margin: 0; min-width: 0;
      overflow: hidden; background: #222;
      aspect-ratio: 1; cursor: default;
    }
    .tile img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    }
    .tile figcaption {
      position: absolute; inset: 0; padding: 1rem;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; color: #fff;
      background: rgba(0, 0, 0, 0.3);
      opacity: 0;
    }
    .tile .name {
      font-size: clamp(1.2rem, 2.2vw, 1.7rem);
      font-weight: 600; letter-spacing: -0.02em; line-height: 1.15;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.5);
    }
    .tile .course { margin-top: 0.4rem; font-size: 0.95rem; text-shadow: 0 1px 10px rgba(0, 0, 0, 0.5); }

    /* Gentle fade and blur when hovering or when a keyboard user tabs to a tile */
    @media (prefers-reduced-motion: no-preference) {
      .tile img { transition: filter 0.5s ease, transform 0.7s ease; }
      .tile figcaption { transition: opacity 0.45s ease; }
    }
    .tile:focus-visible img { filter: blur(7px) brightness(0.85); transform: scale(1.06); }
    .tile:focus-visible figcaption { opacity: 1; }
    @media (hover: hover) {
      .tile:hover img { filter: blur(7px) brightness(0.85); transform: scale(1.06); }
      .tile:hover figcaption { opacity: 1; }
      .tile:hover .hint { opacity: 0; }
    }

    /* Touch screens have no hover, so the name and class stay visible along the bottom */
    @media (hover: none) {
      .tile figcaption {
        opacity: 1; inset: auto 0 0 0;
        align-items: flex-start; justify-content: flex-end; text-align: left;
        padding: 2.5rem 0.9rem 0.8rem;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0));
      }
      .tile .name { font-size: 1.05rem; }
      .tile .course { font-size: 0.85rem; margin-top: 0.15rem; }
      .tile .hint { display: none !important; }
    }

    /* Shown only when the photo file is not found yet */
    .hint {
      display: none; position: absolute; inset: 0; padding: 1rem;
      align-items: flex-end; text-align: left; font-size: 0.9rem; font-weight: 500; color: #000;
    }
    .tile.empty .hint { display: flex; }
    .tone0 { background: var(--blue); }
    .tone0 .hint { color: #fff; }
    .tone1 { background: var(--orange); }
    .tone2 { background: var(--yellow); }
    .tone3 { background: #e4e5de; }

    footer { padding: 2.5rem clamp(1rem, 4vw, 3rem) 3rem; display: flex; flex-wrap: wrap; gap: 1rem 2rem; justify-content: space-between; }
    footer p { margin: 0; }
  </style>
</head>
<body>

  <nav class="nav">
    <!-- EDIT ME: makerspace name. Keep href="index.html" so this links back to your home page. -->
    <a href="index.html">Your Makerspace Name</a>
    <a href="index.html">Home</a>
  </nav>

  <header class="hero">
    <!-- EDIT ME: page headline. Keep the <em> tags around the one italic word. -->
    <h1>Made <em>by</em> students</h1>
    <!-- EDIT ME: one or two sentences introducing this page -->
    <p>A look at what our students designed, built, and tested this year in the makerspace.</p>
  </header>

  <section class="band" aria-label="About this work">
    <div class="band-art" aria-hidden="true">
      <svg viewBox="0 0 300 300">
        <circle cx="105" cy="105" r="70" fill="#df6e56"/>
        <rect x="140" y="130" width="120" height="120" fill="#f1fb8f"/>
        <polygon points="40,260 120,150 200,260" fill="#f5f6f1"/>
        <rect x="40" y="40" width="40" height="14" fill="#000"/>
      </svg>
    </div>
    <div class="band-text">
      <!-- EDIT ME: a short statement about your students' work -->
      <p>Our students design, build, test, and share work that solves real problems.</p>
    </div>
  </section>

  <section class="gallery" aria-labelledby="gallery-title">
    <!-- EDIT ME: gallery heading -->
    <h2 id="gallery-title">Explore the work</h2>
    <div class="filters" id="filters" role="group" aria-label="Filter projects"></div>
    <div class="grid" id="grid"></div>
  </section>

  <footer>
    <!-- EDIT ME: footer text -->
    <p>Your School Name</p>
    <p><a href="index.html">Back to home</a></p>
  </footer>

  <script>
    /* ==========================================================
       EDIT ME: YOUR PROJECTS
       Each block in curly braces { } is one project tile.
       - To add a project, copy a whole block (including the comma after it).
       - To remove one, delete its whole block.
       - title:    the project name shown on hover
       - course:   the class it came from, shown under the name on hover
       - category: the filter button it belongs to
       - image:    the photo file name inside your images folder
       - Use grade level, not student names, unless you have permission.
       ========================================================== */
    const PROJECTS = [
      {
        title: "Electric vehicle challenge",
        course: "Grade 8 Engineering and Design",
        category: "Design challenges",
        image: "images/project-1.jpg"
      },
      {
        title: "3D-printed desk organizer",
        course: "Grade 7 Engineering and Design",
        category: "3D printing",
        image: "images/project-2.jpg"
      },
      {
        title: "Laser-cut lamp",
        course: "Grade 9 Engineering and Design",
        category: "Laser cutting",
        image: "images/project-3.jpg"
      },
      {
        title: "Light-up greeting card",
        course: "Grade 6 Engineering and Design",
        category: "Electronics",
        image: "images/project-4.jpg"
      },
      {
        title: "Sewn circuit bracelet",
        course: "Grade 7 Engineering and Design",
        category: "Textiles",
        image: "images/project-5.jpg"
      },
      {
        title: "Bowl stacking challenge",
        course: "Grade 6 Engineering and Design",
        category: "Design challenges",
        image: "images/project-6.jpg"
      },
      {
        title: "Custom keychain",
        course: "Grade 8 Engineering and Design",
        category: "Laser cutting",
        image: "images/project-7.jpg"
      },
      {
        title: "Marble run",
        course: "Grade 7 Engineering and Design",
        category: "3D printing",
        image: "images/project-8.jpg"
      }
    ];
    /* ===================== END OF EDITABLE AREA ===================== */

    const grid = document.getElementById("grid");
    const filters = document.getElementById("filters");

    function addPhoto(box, project, tone) {
      const hint = document.createElement("span");
      hint.className = "hint";
      hint.textContent = "Add photo: " + project.image;
      const img = new Image();
      img.alt = "Photo of " + project.title;
      img.loading = "lazy";
      img.onerror = function () {
        img.remove();
        box.classList.add("empty", "tone" + (tone % 4));
      };
      img.src = project.image;
      box.append(img, hint);
    }

    function render(category) {
      grid.replaceChildren();
      const list = PROJECTS.filter(function (p) { return category === "All" || p.category === category; });
      list.forEach(function (project, i) {
        const tile = document.createElement("figure");
        tile.className = "tile " + (i % 5 < 2 ? "wide" : "narrow");
        tile.tabIndex = 0;
        addPhoto(tile, project, i);

        const cap = document.createElement("figcaption");
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = project.title;
        const course = document.createElement("span");
        course.className = "course";
        course.textContent = project.course;
        cap.append(name, course);

        tile.append(cap);
        grid.append(tile);
      });
    }

    const categories = ["All"].concat(Array.from(new Set(PROJECTS.map(function (p) { return p.category; }))));
    categories.forEach(function (name) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = name;
      b.setAttribute("aria-pressed", name === "All" ? "true" : "false");
      b.addEventListener("click", function () {
        filters.querySelectorAll("button").forEach(function (x) {
          x.setAttribute("aria-pressed", x === b ? "true" : "false");
        });
        render(name);
      });
      filters.append(b);
    });
    render("All");
  </script>
</body>
</html>
